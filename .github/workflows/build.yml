name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: anvilcraft-dingdongji
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(awk -F"'" '/^version = / {print $2; exit}' build.gradle)
          if [ -z "$VERSION" ]; then
            echo "Could not read version from build.gradle"
            exit 1
          fi
          TAG="v${VERSION}"
          JAR=$(find build/libs -name 'anvilcraft-dingdongji-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n1)
          if [ -z "$JAR" ]; then
            echo "No mod jar found in build/libs"
            exit 1
          fi
          echo "version=$VERSION tag=$TAG jar=$JAR"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skip"
            exit 0
          fi
          gh release create "$TAG" "$JAR" \
            --title "$TAG" \
            --generate-notes \
            --latest
